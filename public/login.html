<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login (Demo)</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #1e2a45 0%, #101827 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
      padding: 24px;
    }

    .login-card {
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .brand-badge {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b5bdb, #6d28d9);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      margin: 0 auto 16px auto;
    }

    .login-card h1 {
      font-size: 20px;
      margin: 0 0 4px 0;
    }

    .login-card p.subtitle {
      margin: 0 0 28px 0;
      font-size: 13px;
      color: #6b7280;
    }

    form {
      text-align: left;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      margin-bottom: 16px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #3b5bdb;
      box-shadow: 0 0 0 3px rgba(59, 91, 219, 0.15);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #1e2a45;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background-color: #131c30;
    }

    .error {
      color: #b91c1c;
      font-size: 13px;
      margin: -8px 0 16px 0;
      min-height: 16px;
    }

    .demo-box {
      margin-top: 24px;
      padding: 14px;
      background-color: #f8f9fb;
      border-radius: 10px;
      font-size: 12px;
      color: #6b7280;
      text-align: left;
    }

    .demo-box strong {
      color: #1f2937;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="brand-badge">MM</div>
    <h1>Meridian Members</h1>
    <p class="subtitle">Demo login &mdash; fabricated test accounts only.</p>

    <form id="login-form">
      <label for="member-id">Member ID</label>
      <input type="text" id="member-id" autocomplete="off" required>

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="off" required>

      <div class="error" id="error-message"></div>

      <button type="submit">Log in</button>
    </form>

    <div class="demo-box">
      <strong>Demo accounts:</strong><br>
      MEM10234 / Demo#2026<br>
      MEM10891 / Test@456<br>
      MEM11207 / Pass!789
    </div>
  </div>

  <script src="../assets/js/demo-data.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const id = document.getElementById("member-id").value.trim().toUpperCase();
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("error-message");
      const account = DEMO_ACCOUNTS[id];

      if (account && account.password === password) {
        sessionStorage.setItem("meridianDemoUser", id);
        window.location.href = "member-dashboard.html";
      } else {
        errorBox.textContent = "Invalid member ID or password.";
      }
    });
  </script>
</body>

</html>
